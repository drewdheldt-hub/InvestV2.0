# What the scheduler runs (investtree scheduler run). Local time; days default to Monday to Friday.
# "{python}" is the project's own interpreter. Each job's output goes to var/logs/<job>_<date>.log and every
# start and finish to the status feed. A job missed while the computer was off still runs if the scheduler
# starts within catch_up_hours of its time.
#
# v2 runs on its own: it starts IB Gateway itself (gateway-morning, gateway-night) and shares nothing with v1
# but the machine's IBC install. The paper overlay moved from v1 to v2 on 2026-10-13; v1's overlay and Gateway
# tasks are disabled. Phase 1 jobs that are switched off wait for the owner:
#   holdings-fetch, suggest, risk-report   need config/accounts.local.yaml and the Flex token first.
# Market-on-open orders must reach IB by 09:28 New York (08:28 Central), hence the overlay's 08:25 cut-off.

jobs:
  # The Gateway each morning before the overlay, or as soon as the scheduler starts at logon later in the
  # day; and at 23:55, after IBC's 23:45 nightly restart, so a failed restart gets a full login in minutes.
  - name: gateway-morning
    command: ["{python}", "-m", "investtree", "gateway", "start"]
    days: [mon, tue, wed, thu, fri, sat, sun]
    at: "07:15"
    timeout_minutes: 5
    catch_up_hours: 16.5

  - name: gateway-night
    command: ["{python}", "-m", "investtree", "gateway", "start"]
    days: [mon, tue, wed, thu, fri, sat, sun]
    at: "23:55"
    timeout_minutes: 5
    catch_up_hours: 0.08

  - name: operator-briefing
    command: ["{python}", "-m", "investtree", "brief"]
    at: "17:30"
    timeout_minutes: 10
    catch_up_hours: 6

  - name: backup
    command: ["{python}", "-m", "investtree", "backup", "run"]
    days: [sun]
    at: "18:00"
    timeout_minutes: 120
    catch_up_hours: 48

  - name: backup-verify
    command: ["{python}", "-m", "investtree", "backup", "verify"]
    days: [sun]
    at: "19:00"
    timeout_minutes: 120
    catch_up_hours: 48

  - name: data-update
    command: ["{python}", "-m", "investtree", "data", "update", "--wait-minutes", "120"]
    at: "16:30"
    timeout_minutes: 180
    catch_up_hours: 6

  - name: overlay-paper
    command: ["{python}", "-m", "investtree", "overlay", "run", "spy_voltarget", "--wait-until", "08:25"]
    at: "07:45"
    timeout_minutes: 60
    catch_up_hours: 0.6

  - name: overlay-fills
    command: ["{python}", "-m", "investtree", "overlay", "fills", "spy_voltarget", "--wait-until", "15:00"]
    at: "09:00"
    timeout_minutes: 380
    catch_up_hours: 5

  - name: holdings-fetch
    command: ["{python}", "-m", "investtree", "holdings", "fetch"]
    at: "07:00"
    timeout_minutes: 15
    catch_up_hours: 3
    enabled: false

  - name: suggest
    command: ["{python}", "-m", "investtree", "suggest"]
    at: "07:20"
    timeout_minutes: 10
    catch_up_hours: 3
    enabled: false

  - name: risk-report
    command: ["{python}", "-m", "investtree", "report"]
    at: "07:25"
    timeout_minutes: 10
    catch_up_hours: 3
    enabled: false
