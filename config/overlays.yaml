# Paper overlay runners (investtree overlay run NAME). Each manages `capital` of the PAPER account with
# market-on-open orders tagged investtree-overlay. Real accounts never get orders: see config/accounts.local.yaml
# and `investtree suggest` for suggested trades.
#
# spy_voltarget is the runner v1 started on 2026-10-08 (SPY at a 10% volatility target, $100,000). It moved
# to v2 on 2026-10-13: its state was imported with `investtree overlay import-v1 spy_voltarget`, and v1's
# "investTree overlay paper" and "investTree overlay fills" Task Scheduler entries were disabled. Never
# re-enable those while execute is true here: two runners on the same account would double every trade.
# v2 no longer reads anything from v1's folder.

overlays:
  - name: spy_voltarget
    weights: {SPY: 1.0}
    policy: vol_target
    capital: 100000
    execute: true
    min_trade: 0.005
    client_id: 61
