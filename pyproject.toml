[project]
name = "investtree"
version = "0.1.0"
description = "investTree 2: portfolio risk tools first, evidence-gated research second, AI agents inside code-enforced guardrails."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ib_async>=2.1",
    "keyring>=25",
    "pydantic>=2.9",
    "pyyaml>=6",
]

[project.optional-dependencies]
agents = ["anthropic>=0.60"]

[project.scripts]
investtree = "investtree.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investtree"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not paper'"
markers = [
    "paper: read-only contract tests against a running IB Gateway or TWS on a paper port (run with: pytest -m paper)",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["investtree"]

[[tool.mypy.overrides]]
module = ["ib_async.*", "keyring.*", "anthropic.*"]
ignore_missing_imports = true
